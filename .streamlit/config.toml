[theme]
primaryColor = "#00d4ff"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#1a1d29"
textColor = "#fafafa"
font = "sans serif"
base = "dark"

[server]
headless = true
port = 8501
enableXsrfProtection = true
maxUploadSize = 200
enableCORS = false

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true
fastReruns = true

[client]
showErrorDetails = true
